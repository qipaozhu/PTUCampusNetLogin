# 告诉 qmllint / QML 语言服务器（含 VS / Qt Creator 里的实时检查）：
# 下面这些名字是 main.cpp 里用 setContextProperty() 注入的上下文属性，
# 静态分析看不到它们的声明，所以不要再报 Unqualified access [unqualified]。
#
# 文件名和格式由 Qt 规定（Qt 6.12 文档 “qmllint → Context property settings”）：
#   .contextProperties.ini 放在 QML 源文件所在目录，qmllint 会从被检查的文件
#   向上逐级查找。名称必须和 setContextProperty() 的第一个参数完全一致。
[General]
disableUnqualifiedAccess = "controller,network,systemTheme,portal,appFontFamily"
disableHeuristic = false
